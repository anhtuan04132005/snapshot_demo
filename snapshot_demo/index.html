<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo tải ảnh snapshot</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#0b2540}
  h1{font-size:22px} h2{font-size:16px;margin-top:28px}
  .cam{background:#0b2540;border-radius:12px;overflow:hidden;max-width:640px}
  .cam img{width:100%;display:block}
  button{background:#0ea5e9;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
  button.sec{background:#e5e7eb;color:#111}
  .row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  #msg{font-size:13px;color:#555;min-height:18px}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.minio{background:#fde8e8;color:#b91c1c} .badge.local{background:#e5e7eb;color:#374151}
  ul{list-style:none;padding:0} li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee}
  li img{width:64px;height:48px;object-fit:cover;border-radius:6px}
  li span{flex:1;font-family:monospace;font-size:13px}
</style>
</head>
<body>
<h1>Demo tải ảnh snapshot</h1>

<div class="cam"><img src="/video_feed" alt="live"></div>
<div class="row">
  <button onclick="captureAndDownload()">Chụp &amp; tải ảnh (live)</button>
  <button class="sec" onclick="saveToServer()">Lưu ảnh lên server (giống ảnh sự kiện)</button>
</div>
<div id="msg"></div>
<div id="storage" style="margin-top:6px;font-size:13px"></div>

<h2>Ảnh đã lưu</h2>
<ul id="list"></ul>

<script>
const msg = t => document.getElementById('msg').textContent = t;

// Tải ảnh bằng fetch + blob: chạy được cả khi frontend và backend khác origin
async function downloadImage(url, filename){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

async function captureAndDownload(){
  try{ await downloadImage('/snapshot', 'cam_'+stamp()+'.jpg'); msg('Đã tải ảnh live.'); }
  catch(e){ msg('Lỗi: '+e.message); }
}

// Hỏi server link tải: với MinIO đó là presigned URL (link tạm thời có chữ ký),
// với chế độ local đó là route /download/snapshot/... của chính server.
// Dùng điều hướng qua thẻ <a> nên không bị chặn CORS khi link trỏ sang cổng 9000 của MinIO.
async function downloadSaved(name){
  const r = await fetch('/api/download-url/' + encodeURIComponent(name));
  const j = await r.json();
  if(!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  const a = document.createElement('a');
  a.href = j.url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  msg('Đang tải: ' + name);
}

async function loadStorage(){
  const j = await (await fetch('/storage')).json();
  const label = j.kind === 'minio' ? 'MinIO' : 'Thư mục local (chưa kết nối MinIO)';
  document.getElementById('storage').innerHTML =
    'Nơi lưu ảnh: <span class="badge ' + j.kind + '">' + label + '</span> <code>' + j.where + '</code>';
}

async function saveToServer(){
  const r = await fetch('/snapshot/save', {method:'POST'});
  const j = await r.json();
  msg(r.ok ? 'Đã lưu vào ' + (j.storage === 'minio' ? 'MinIO' : 'thư mục') + ': ' + j.saved : 'Lỗi: '+j.detail);
  loadList();
}

async function loadList(){
  const j = await (await fetch('/snapshots')).json();
  const ul = document.getElementById('list'); ul.innerHTML='';
  if(!j.files.length){ ul.innerHTML='<li>Chưa có ảnh nào. Bấm "Lưu ảnh lên server".</li>'; return; }
  j.files.forEach(f=>{
    const li=document.createElement('li');
    li.innerHTML='<img src="/snapshots/'+encodeURIComponent(f)+'"><span>'+f+'</span>';
    const b=document.createElement('button'); b.textContent='Tải ảnh';
    b.onclick=()=>downloadSaved(f).catch(e=>msg('Lỗi: '+e.message));
    li.appendChild(b); ul.appendChild(li);
  });
}
loadStorage();
loadList();
</script>
</body>
</html>
